<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线考试系统 · 学生端</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 顶栏 -->
<header class="topbar" id="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <span class="brand-logo">考</span>
      <span class="brand-text">在线考试系统 <em>学生端</em></span>
    </div>

    <!-- 答题状态：仅考试中显示 -->
    <div class="exam-status hidden" id="examStatus">
      <span class="status-item">
        <span class="status-label">试卷</span>
        <span id="examStatusPaper">—</span>
      </span>
      <span class="status-item">
        <span class="status-label">已答</span>
        <span id="examStatusProgress">0/0</span>
      </span>
      <span class="status-item">
        <span class="status-label">自动保存</span>
        <span id="examStatusSave" class="save-state">—</span>
      </span>
      <span class="countdown" id="countdown">--:--:--</span>
    </div>

    <!-- 用户信息 -->
    <div class="user-area">
      <span class="user-chip hidden" id="userChip">
        <span class="user-avatar" id="userAvatar">学</span>
        <span class="user-meta">
          <b id="userRealName">—</b>
          <small id="userAccount">—</small>
        </span>
      </span>
      <button class="btn btn-ghost hidden" id="btnLogout" type="button">退出登录</button>
    </div>
  </div>
</header>

<!-- 页面内容挂载点 -->
<main class="app" id="app"></main>

<!-- 全局提示 -->
<div class="toast-host" id="toastHost"></div>

<!-- 确认对话框 -->
<div class="modal-mask hidden" id="modalMask">
  <div class="modal" role="dialog" aria-modal="true">
    <h3 class="modal-title" id="modalTitle">提示</h3>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>

<script src="js/md5.js"></script>
<script src="js/mock-db.js"></script>
<script src="js/api.js"></script>
<script src="js/ui.js"></script>
<script src="js/page-exam-list.js"></script>
<script src="js/page-exam.js"></script>
<script src="js/page-result.js"></script>
<script src="js/app.js"></script>
<script src="js/selftest.js"></script>
</body>
</html>
